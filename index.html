<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flag Royale 50 Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Full Height Mobile Layout (No Empty Space) */
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030611;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .main-wrapper {
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #0d1733 0%, #040814 100%);
      position: relative;
      overflow: hidden;
      border-left: 1px solid #1a253d;
      border-right: 1px solid #1a253d;
    }

    /* ১. OTHERS TOOLS HEADER */
    .tools-header {
      height: 48px;
      min-height: 48px;
      background: rgba(13, 20, 36, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 2px solid #1a2744;
      flex-shrink: 0;
      z-index: 10;
    }
    .tools-left, .tools-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #151d30;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #24355a;
    }
    .badge-val {
      color: #38bdf8;
      font-weight: 900;
      margin-left: 3px;
    }
    .logo {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #facc15;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* ২. FLAGS ARENA (মাঝের পুরো জায়গা কাভার করবে) */
    .arena-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    canvas {
      display: block;
      width: 96% !important;
      height: auto !important;
      max-height: 98% !important;
      aspect-ratio: 1 / 1;
    }

    /* ৩. ELIMINATED LIST */
    .elim-box {
      height: 48px;
      min-height: 48px;
      background: #090e1b;
      border: 1px solid rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      margin: 0 8px;
      border-radius: 8px;
    }
    .elim-box::-webkit-scrollbar { display: none; }
    .elim-title {
      color: #ef4444;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .elim-list {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .elim-badge {
      display: flex;
      align-items: center;
      background: #141c2e;
      border: 1px solid #23314d;
      border-radius: 4px;
      padding: 2px 5px;
      gap: 4px;
      animation: popIn 0.3s ease-out;
    }
    .elim-rank {
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
    }
    .elim-flag {
      width: 20px;
      height: 14px;
      border-radius: 2px;
      object-fit: cover;
    }

    /* ৪. LIVE CHAT (ঠিক ২ লাইন নিচে) */
    .chat-box {
      height: 68px;
      min-height: 68px;
      max-height: 68px;
      background: #080d1a;
      border: 1px solid #1c2742;
      border-radius: 8px;
      margin: 6px 8px 8px 8px;
      display: flex;
      flex-direction: column;
      padding: 5px 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .chat-header {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      overflow: hidden;
    }
    .chat-msg {
      background: #111828;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.2;
      border-left: 3px solid #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-msg.elim-msg {
      border-left-color: #ef4444;
      background: rgba(36, 17, 24, 0.8);
    }
    .chat-user {
      color: #38bdf8;
      font-weight: bold;
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- ১. Tools Header -->
    <div class="tools-header">
      <div class="tools-left">
        <div class="badge">R <span class="badge-val" id="roundNum">1</span></div>
        <div class="badge">ALIVE <span class="badge-val" id="inPlayCount">50</span></div>
      </div>
      <div class="logo">FLAG ROYALE</div>
      <div class="tools-right">
        <div class="badge"><span class="live-dot"></span> <span style="color:#22c55e; margin-left:3px;">LIVE</span></div>
      </div>
    </div>

    <!-- ২. Flags Arena -->
    <div class="arena-box">
      <canvas id="gameCanvas" width="700" height="700"></canvas>
    </div>

    <!-- ৩. Eliminated List -->
    <div class="elim-box">
      <div class="elim-title">OUT:</div>
      <div class="elim-list" id="eliminatedList"></div>
    </div>

    <!-- ৪. Live Chat -->
    <div class="chat-box">
      <div class="chat-header">
        <span>LIVE CHAT</span>
        <span style="color: #22c55e;">● ACTIVE</span>
      </div>
      <div class="chat-messages" id="chatBox"></div>
    </div>

  </div>

  <script>
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 🔴 ঠিক ৫০টি দেশ
    const countryList = [
      { code: 'bd', name: 'Bangladesh' },
      { code: 'ar', name: 'Argentina' },
      { code: 'br', name: 'Brazil' },
      { code: 'ps', name: 'Palestine' },
      { code: 'pt', name: 'Portugal' },
      { code: 'de', name: 'Germany' },
      { code: 'fr', name: 'France' },
      { code: 'us', name: 'USA' },
      { code: 'gb', name: 'UK' },
      { code: 'in', name: 'India' },
      { code: 'pk', name: 'Pakistan' },
      { code: 'jp', name: 'Japan' },
      { code: 'es', name: 'Spain' },
      { code: 'it', name: 'Italy' },
      { code: 'sa', name: 'Saudi Arabia' },
      { code: 'ca', name: 'Canada' },
      { code: 'au', name: 'Australia' },
      { code: 'tr', name: 'Turkey' },
      { code: 'ma', name: 'Morocco' },
      { code: 'kr', name: 'South Korea' },
      { code: 'nl', name: 'Netherlands' },
      { code: 'hr', name: 'Croatia' },
      { code: 'sn', name: 'Senegal' },
      { code: 'mx', name: 'Mexico' },
      { code: 'eg', name: 'Egypt' },
      { code: 'ng', name: 'Nigeria' },
      { code: 'gh', name: 'Ghana' },
      { code: 'cm', name: 'Cameroon' },
      { code: 'uy', name: 'Uruguay' },
      { code: 'co', name: 'Colombia' },
      { code: 'cl', name: 'Chile' },
      { code: 'be', name: 'Belgium' },
      { code: 'ch', name: 'Switzerland' },
      { code: 'se', name: 'Sweden' },
      { code: 'no', name: 'Norway' },
      { code: 'dk', name: 'Denmark' },
      { code: 'pl', name: 'Poland' },
      { code: 'ru', name: 'Russia' },
      { code: 'cn', name: 'China' },
      { code: 'id', name: 'Indonesia' },
      { code: 'my', name: 'Malaysia' },
      { code: 'ir', name: 'Iran' },
      { code: 'qa', name: 'Qatar' },
      { code: 'ae', name: 'UAE' },
      { code: 'za', name: 'South Africa' },
      { code: 'dz', name: 'Algeria' },
      { code: 'tn', name: 'Tunisia' },
      { code: 'iq', name: 'Iraq' },
      { code: 'nz', name: 'New Zealand' },
      { code: 'np', name: 'Nepal' }
    ];

    const flagImages = {};
    countryList.forEach(c => {
      const img = new Image();
      img.src = `https://flagcdn.com/w80/${c.code}.png`;
      flagImages[c.code] = img;
    });

    let round = 1;
    const initialRadius = 330;
    let arenaRadius = initialRadius;
    const minRadius = 85;
    let gapAngle = 0;
    const gapSize = 0.42; // ছোট গ্যাপ, সাসপেন্স বেশি
    let flags = [];
    let eliminatedFlags = [];
    let isGameOver = false;

    function addChatMessage(user, msg, isElim = false) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'chat-msg' + (isElim ? ' elim-msg' : '');
      div.innerHTML = `<span class="chat-user">${user}:</span> ${msg}`;
      chatBox.appendChild(div);

      while (chatBox.children.length > 2) {
        chatBox.removeChild(chatBox.children[0]);
      }
    }

    function initGame() {
      arenaRadius = initialRadius;
      gapAngle = 0;
      isGameOver = false;
      eliminatedFlags = [];
      document.getElementById('roundNum').innerText = round;
      document.getElementById('eliminatedList').innerHTML = '';

      // ৫০টি ফ্ল্যাগ তৈরি
      flags = countryList.map(c => {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (arenaRadius - 80);
        return {
          code: c.code,
          name: c.name,
          x: canvas.width / 2 + Math.cos(angle) * dist,
          y: canvas.height / 2 + Math.sin(angle) * dist,
          vx: (Math.random() - 0.5) * 3.6,
          vy: (Math.random() - 0.5) * 3.6,
          radius: 14.5,
          eliminated: false,
          falling: false
        };
      });

      updateUI();
      addChatMessage("System", `Round ${round} Started! (50 Nations) 🔥`);
    }

    const fakeUsers = ["Alex_99", "Tanvir_BD", "Messi10", "CR7_Boss", "NinjaX", "Rahim", "Sabbir", "David"];
    setInterval(() => {
      if (!isGameOver) {
        const active = flags.filter(f => !f.eliminated);
        if (active.length > 1) {
          const u = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
          const rCountry = active[Math.floor(Math.random() * active.length)];
          addChatMessage(u, `Go ${rCountry.name}! 🚀`);
        }
      }
    }, 2800);

    function updatePhysics() {
      if (isGameOver) return;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // ধীরে রিং ছোট হবে (সাসপেন্স)
      if (arenaRadius > minRadius) {
        arenaRadius -= 0.038;
      }
      gapAngle += 0.012;
      if (gapAngle > Math.PI * 2) gapAngle -= Math.PI * 2;

      flags.forEach(f => {
        if (f.falling) {
          f.vy += 0.35;
          f.x += f.vx;
          f.y += f.vy;
          return;
        }

        f.x += f.vx;
        f.y += f.vy;

        f.vx += (Math.random() - 0.5) * 0.08;
        f.vy += (Math.random() - 0.5) * 0.08;

        const dx = f.x - cx;
        const dy = f.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        if (dist + f.radius >= arenaRadius) {
          let curAngle = Math.atan2(dy, dx);
          if (curAngle < 0) curAngle += Math.PI * 2;

          let diff = Math.abs(curAngle - gapAngle);
          if (diff > Math.PI) diff = Math.PI * 2 - diff;

          // গ্যাপ দিয়ে বের হলে
          if (diff < gapSize / 2) {
            if (dist >= arenaRadius + 6) {
              f.eliminated = true;
              f.falling = true;
              f.vx = nx * 3.5 + (Math.random() - 0.5) * 1.5;
              f.vy = ny * 3.5 - 1.5;

              handleElimination(f);
              return;
            }
          } else {
            // দেয়ালে বাউন্স
            const dot = f.vx * nx + f.vy * ny;
            if (dot > 0) {
              f.vx = (f.vx - 2 * dot * nx) * 0.94;
              f.vy = (f.vy - 2 * dot * ny) * 0.94;
            }
            f.x = cx + nx * (arenaRadius - f.radius - 1);
            f.y = cy + ny * (arenaRadius - f.radius - 1);
          }
        }
      });

      // ফ্ল্যাগ বাউন্স সংঘর্ষ
      const activeFlags = flags.filter(f => !f.eliminated);
      for (let i = 0; i < activeFlags.length; i++) {
        for (let j = i + 1; j < activeFlags.length; j++) {
          const f1 = activeFlags[i];
          const f2 = activeFlags[j];
          const dx = f2.x - f1.x;
          const dy = f2.y - f1.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < f1.radius + f2.radius) {
            const angle = Math.atan2(dy, dx);
            const sin = Math.sin(angle);
            const cos = Math.cos(angle);

            const overlap = (f1.radius + f2.radius) - dist;
            f1.x -= cos * overlap * 0.5;
            f1.y -= sin * overlap * 0.5;
            f2.x += cos * overlap * 0.5;
            f2.y += sin * overlap * 0.5;

            const tempVx = f1.vx;
            const tempVy = f1.vy;
            f1.vx = f2.vx * 1.01;
            f1.vy = f2.vy * 1.01;
            f2.vx = tempVx * 1.01;
            f2.vy = tempVy * 1.01;
          }
        }
      }

      // উইনার
      if (activeFlags.length === 1 && !isGameOver) {
        isGameOver = true;
        const winner = activeFlags[0];
        addChatMessage("WINNER", `🏆 ${winner.name} IS THE CHAMPION!`);
        setTimeout(() => {
          round++;
          initGame();
        }, 4500);
      }
    }

    function handleElimination(flag) {
      const rank = countryList.length - eliminatedFlags.length;
      flag.rank = rank;
      eliminatedFlags.push(flag);

      addChatMessage("Eliminated", `#${rank} ${flag.name} fell out! ❌`, true);
      updateUI();

      const elimList = document.getElementById('eliminatedList');
      const badge = document.createElement('div');
      badge.className = 'elim-badge';
      badge.innerHTML = `
        <span class="elim-rank">#${rank}</span>
        <img src="https://flagcdn.com/w40/${flag.code}.png" class="elim-flag" alt="${flag.name}">
      `;
      elimList.appendChild(badge);

      const elimBox = document.querySelector('.elim-box');
      elimBox.scrollLeft = elimBox.scrollWidth;
    }

    function updateUI() {
      const active = flags.filter(f => !f.eliminated);
      document.getElementById('inPlayCount').innerText = active.length;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // এরিনা ব্যাকগ্রাউন্ড
      const bgGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, arenaRadius);
      bgGrad.addColorStop(0, '#0a142c');
      bgGrad.addColorStop(0.7, '#070c1b');
      bgGrad.addColorStop(1, '#02050e');
      ctx.beginPath();
      ctx.arc(cx, cy, arenaRadius, 0, Math.PI * 2);
      ctx.fillStyle = bgGrad;
      ctx.fill();

      // উজ্জ্বল নিওন সাইয়ান রিং
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, arenaRadius, gapAngle + gapSize / 2, gapAngle - gapSize / 2 + Math.PI * 2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 18;
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();

      // গ্যাপের দুই মাথায় স্পার্ক ডট
      [gapAngle + gapSize / 2, gapAngle - gapSize / 2].forEach(ang => {
        const px = cx + Math.cos(ang) * arenaRadius;
        const py = cy + Math.sin(ang) * arenaRadius;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.fill();
      });

      // ফ্ল্যাগগুলো রেন্ডার
      flags.forEach(f => {
        if (f.y > canvas.height + 60) return;

        ctx.save();
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;
        ctx.clip();

        const img = flagImages[f.code];
        if (img && img.complete) {
          ctx.drawImage(img, f.x - f.radius, f.y - f.radius, f.radius * 2, f.radius * 2);
        } else {
          ctx.fillStyle = '#38bdf8';
          ctx.fill();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      });

      // বিজয়ী স্ক্রিন
      if (isGameOver) {
        const winner = flags.find(f => !f.eliminated);
        if (winner) {
          ctx.fillStyle = 'rgba(2, 5, 14, 0.88)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 36px sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 20;
          ctx.fillText(`🏆 ${winner.name}`, cx, cy - 15);

          ctx.fillStyle = '#38bdf8';
          ctx.font = '800 20px sans-serif';
          ctx.fillText(`C H A M P I O N !`, cx, cy + 20);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '14px sans-serif';
          ctx.fillText(`Next round starting soon...`, cx, cy + 50);
        }
      }
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    addChatMessage("System", "Welcome to Flag Royale High Stakes!");
    initGame();
    loop();
  </script>
</body>
</html>
